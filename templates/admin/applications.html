{% extends "base.html" %}

{% block content %}
<h2>All Applications</h2>

{% if applications %}
    {% for app in applications %}
        <div>
            <p>Student ID: {{ app.student_id }}</p>
            <p>Drive ID: {{ app.drive_id }}</p>
            <p>Status: {{ app.status }}</p>
            <hr>
        </div>
    {% endfor %}
{% else %}
    <p>No applications found</p>
{% endif %}

{% endblock %}
