{% extends "base.html" %}
{% block content %}

<h2>Students</h2>

<table>
<tr>
    <th>Name</th>
    <th>Email</th>
    <th>Blacklisted</th>
    <th>Action</th>
</tr>

{% for student in students %}
<tr>
    <td>{{ student.name }}</td>
    <td>{{ student.email }}</td>
    <td>{{ student.is_blacklisted }}</td>
    <td>
        <a href="/admin/student/{{ student.id }}/blacklist">Blacklist</a>
    </td>
</tr>
{% endfor %}

</table>

{% endblock %}
