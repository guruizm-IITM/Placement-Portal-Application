{% extends "base.html" %}
{% block content %}

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-trophy-fill me-2"></i>All Placements</h2>
        <a href="/admin/dashboard" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
        </a>
    </div>

    <div class="card">
        <div class="card-header py-3">
            <i class="bi bi-table me-2"></i>Placed Students
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Student</th>
                            <th>Email</th>
                            <th>Company</th>
                            <th>Job Title</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for p in placements %}
                        <tr>
                            <td>{{ loop.index }}</td>
                            <td>{{ p.student.name }}</td>
                            <td>{{ p.student.email }}</td>
                            <td>{{ p.drive.company.name }}</td>
                            <td><span class="badge bg-success">{{ p.drive.job_title }}</span></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

{% endblock %}
