{% extends "base.html" %}
{% block content %}

<h2>Placements</h2>

<table>
<tr>
    <th>Student</th>
    <th>Company</th>
    <th>Job</th>
</tr>

{% for p in placements %}
<tr>
    <td>{{ p.student.name }}</td>
    <td>{{ p.drive.company.name }}</td>
    <td>{{ p.drive.job_title }}</td>
</tr>
{% endfor %}

</table>

{% endblock %}
