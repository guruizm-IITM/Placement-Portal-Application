{% extends "base.html" %}

{% block content %}
<h2>Pending Drives</h2>

{% if drives %}
    <ul>
    {% for drive in drives %}
        <li>
            {{ drive.title }} (Company ID: {{ drive.company_id }})
            <a href="/admin/approve_drive/{{ drive.id }}">Approve</a>
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>No pending drives</p>
{% endif %}

{% endblock %}
