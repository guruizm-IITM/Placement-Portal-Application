{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-center align-items-center py-5">
    <div class="card p-4" style="width: 480px;">
        <div class="card-header text-center py-3 mb-3">
            <i class="bi bi-building fs-4 me-2"></i>Company Registration
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Company Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter company name" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">HR Contact</label>
                <input type="text" name="hr_contact" class="form-control" placeholder="HR contact name or number">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Company Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter company email" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Website</label>
                <input type="text" name="website" class="form-control" placeholder="https://yourcompany.com">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Create a password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-check-circle me-2"></i>Register Company
            </button>
        </form>
        <div class="text-center mt-3 small">
            Already registered? <a href="/login">Login here</a>
        </div>
    </div>
</div>

{% endblock %}
