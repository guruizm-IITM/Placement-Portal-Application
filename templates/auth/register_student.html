{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-center align-items-center py-5">
    <div class="card p-4" style="width: 480px;">
        <div class="card-header text-center py-3 mb-3">
            <i class="bi bi-person-plus-fill fs-4 me-2"></i>Student Registration
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter your full name" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Create a password" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Skills</label>
                <textarea name="skills" class="form-control" rows="3" placeholder="e.g. Python, Flask, SQL, JavaScript"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-check-circle me-2"></i>Register
            </button>
        </form>
        <div class="text-center mt-3 small">
            Already registered? <a href="/login">Login here</a>
        </div>
    </div>
</div>

{% endblock %}
