{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height: 85vh;">
    <div class="card p-4" style="width: 400px;">
        <div class="text-center mb-3">
            <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-2"
                 style="width:65px; height:65px; background: linear-gradient(135deg, #1e3a8a, #3b82f6);">
                <i class="bi bi-mortarboard-fill text-white fs-3"></i>
            </div>
            <h4 class="fw-bold mb-0">XYZ Institute</h4>
            <p class="text-muted small">Placement Portal</p>
            <hr>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email or Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="email" class="form-control" placeholder="Enter email or username" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </button>
        </form>

        <hr>
        <div class="text-center small">
            <a href="/register/student" class="text-decoration-none me-3">
                <i class="bi bi-person-plus me-1"></i>Register as Student
            </a>
            <a href="/register/company" class="text-decoration-none">
                <i class="bi bi-building me-1"></i>Register as Company
            </a>
        </div>
    </div>
</div>

{% endblock %}
