{% extends "base.html" %}
{% block content %}

<div style="display:flex; justify-content:center; align-items:center; height:80vh;">

    <div style="background:white; padding:30px; border-radius:10px; width:350px; text-align:center; box-shadow:0 0 10px rgba(0,0,0,0.1);">

        <!-- LOGO -->
        <div style="
            width:60px;
            height:60px;
            margin:auto;
            border-radius:50%;
            background:linear-gradient(135deg, #1e3a8a, #3b82f6);
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-weight:bold;
            font-size:20px;
        ">
            XYZ
        </div>

        <h2 style="margin:10px 0 0;">XYZ Institute</h2>
        <h4 style="margin:5px 0; color:gray;">Placement Portal</h4>

        <p style="font-size:14px; color:#555;">
            Welcome to the placement portal of XYZ Institute of Technology
        </p>

        <hr>

        <!-- LOGIN FORM -->
        <form method="POST" action="{{ url_for('auth.login') }}">

            <input type="text" name="email" placeholder="Email or Username" required
                   style="width:100%; padding:8px; margin:8px 0;"><br>

            <input type="password" name="password" placeholder="Password" required
                   style="width:100%; padding:8px; margin:8px 0;"><br>

            <button type="submit"
                    style="width:100%; padding:10px; background:#1e3a8a; color:white; border:none; border-radius:5px;">
                Login
            </button>
        </form>

        <br>

        <a href="/register/student">Register as Student</a><br>
        <a href="/register/company">Register as Company</a>

    </div>

</div>

{% endblock %}
