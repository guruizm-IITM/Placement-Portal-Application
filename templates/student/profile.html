{% extends "base.html" %}
{% block content %}

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-person-circle me-2"></i>Edit Profile</h2>
        <a href="/student/dashboard" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Full Name</label>
                        <input type="text" name="name" class="form-control"
                               value="{{ current_user.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Skills</label>
                        <textarea name="skills" class="form-control" rows="3"
                                  placeholder="e.g. Python, Flask, SQL">{{ current_user.skills }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Resume Link</label>
                        <input type="text" name="resume" class="form-control"
                               value="{{ current_user.resume }}" placeholder="https://your-resume-link.com">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-save me-2"></i>Update Profile
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
