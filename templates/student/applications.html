{% extends "base.html" %}

{% block content %}
<h2>My Applications</h2>

{% if applications %}
    {% for app in applications %}
        <div>
            <p>Drive ID: {{ app.drive_id }}</p>
            <p>Status: {{ app.status }}</p>
            <hr>
        </div>
    {% endfor %}
{% else %}
    <p>No applications yet</p>
{% endif %}

{% endblock %}
