{% extends "base.html" %}

{% block content %}
<h2>Available Drives</h2>

{% for drive in drives %}
<div class="card mb-3 p-3">
    <h5>{{ drive.title }}</h5>
    <p>{{ drive.description }}</p>
    <p>Date: {{ drive.date }}</p>

    <a href="/student/apply/{{ drive.id }}" class="btn btn-success btn-sm">
        Apply
    </a>
</div>
{% endfor %}

<a href="/student/drives">View Drives</a>

{% endblock %}
