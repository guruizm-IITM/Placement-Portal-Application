{% extends "base.html" %}
{% block content %}

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-building me-2"></i>Edit Company Profile</h2>
        <a href="/company/dashboard" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Company Name</label>
                        <input type="text" name="name" class="form-control"
                               value="{{ current_user.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control"
                               value="{{ current_user.email }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">HR Contact</label>
                        <input type="text" name="hr_contact" class="form-control"
                               value="{{ current_user.hr_contact }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Website</label>
                        <input type="text" name="website" class="form-control"
                               value="{{ current_user.website }}">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-save me-2"></i>Update Profile
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
