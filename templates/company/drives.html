{% extends "base.html" %}

{% block content %}
<h2>My Drives</h2>

{% if drives %}
    {% for drive in drives %}
        <div>
            <h3>{{ drive.title }}</h3>
            <p>{{ drive.description }}</p>
            <p>Date: {{ drive.date }}</p>

            <a href="/company/applicants/{{ drive.id }}">View Applicants</a>
            <hr>
        </div>
    {% endfor %}
{% else %}
    <p>No drives created yet</p>
{% endif %}

{% endblock %}
