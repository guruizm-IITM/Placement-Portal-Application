{% extends "base.html" %}
{% block content %}

<h2>Create Placement Drive</h2>

<form method="POST">

    <input type="text" name="title" placeholder="Job Title" required><br><br>

    <textarea name="description" placeholder="Job Description"></textarea><br><br>

    <textarea name="eligibility" placeholder="Eligibility Criteria"></textarea><br><br>

    <input type="date" name="deadline" required><br><br>

    <button type="submit">Create Drive</button>

</form>

{% endblock %}
