{% extends "base.html" %}

{% block content %}
<h3>Login</h3>

<form method="POST" class="card p-3">

    <div class="mb-2">
        <label>Email</label>
        <input type="email" name="email" class="form-control">
    </div>

    <div class="mb-2">
        <label>Password</label>
        <input type="password" name="password" class="form-control">
    </div>

    <button class="btn btn-primary mt-2">Login</button>

</form>

{% endblock %}
